[package]
name = "net-redirect"
version = "0.7.2"
description = "Redirect system traffic to another host:port (pf + local TCP proxy)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tauri-plugin-single-instance = "2"
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
